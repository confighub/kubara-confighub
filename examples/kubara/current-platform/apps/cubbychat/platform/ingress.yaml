apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cubbychat
  namespace: cubbychat
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cubbychat.local
      secretName: cubbychat-tls
  rules:
    - host: cubbychat.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
