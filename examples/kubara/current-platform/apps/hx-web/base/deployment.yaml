apiVersion: apps/v1
kind: Deployment
metadata:
  name: hx-web
  namespace: hx-web
  labels:
    app.kubernetes.io/name: hx-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hx-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hx-web
    spec:
      containers:
        - name: nginx
          image: nginx@sha256:6784fb0834aa7dbbe12e3d7471e69c290df3e6ba810dc38b34ae33d3c1c05f7d
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
