# Kind proof override: leave cub's first mapped NodePort reserved for argocd-server.
traefik:
  service:
    spec:
      type: NodePort
  ports:
    web:
      nodePort: 30002
    websecure:
      nodePort: 30003
  providers:
    kubernetesIngress:
      publishedService:
        enabled: false
      ingressEndpoint:
        hostname: hx-app-dev.traefik.me
