# Kind proof override: leave cub's first mapped NodePort reserved for argocd-server.
traefik:
  service:
    spec:
      type: NodePort
  ports:
    web:
      nodePort: 30012
    websecure:
      nodePort: 30013
  providers:
    kubernetesIngress:
      publishedService:
        enabled: false
      ingressEndpoint:
        hostname: hx-app-staging.traefik.me
