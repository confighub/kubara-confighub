# argobot, as cub kubara handover installs it on Kubara's hub.
# It records each Argo CD Application's sync and health on the release the
# Application synced, in the ConfigHub Space its OCI source names.
# It runs as a service account the Targets grant EditChildren, with a key
# handover.sh writes to the argobot-secrets Secret, and hears of each published release
# on the Channel kx-targets/argobot.
apiVersion: v1
kind: Namespace
metadata:
  name: argobot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argobot
  namespace: argobot
---
# argobot watches Applications, and patches an Application's refresh
# annotation when ConfigHub publishes a release. It needs nothing else, and
# nothing outside the Argo CD namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argobot
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argobot
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argobot
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: argobot
  labels:
    app: argobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argobot
  template:
    metadata:
      labels:
        app: argobot
    spec:
      serviceAccountName: argobot
      containers:
        - name: argobot
          image: ghcr.io/confighub/argobot:v0.2.3
          env:
            - name: CONFIGHUB_URL
              valueFrom:
                secretKeyRef:
                  name: argobot-secrets
                  key: CONFIGHUB_URL
            - name: CONFIGHUB_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: argobot-secrets
                  key: CONFIGHUB_AUTH_PRIVATE_KEY
            - name: CONFIGHUB_CHANNEL
              value: kx-targets/argobot
            - name: ARGO_NAMESPACE
              value: argocd
            - name: ARGO_REFRESH_TYPE
              value: hard
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
