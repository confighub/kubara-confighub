apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    helm.sh/chart: argo-cd-10.7.0
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/instance: argo-cd
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: v3.5.2
data:
  accounts.wizard: login, apiKey
  accounts.wizard.enabled: 'true'
  admin.enabled: 'false'
  application.instanceLabelKey: argocd.argoproj.io/instance
  application.sync.impersonation.enabled: 'false'
  exec.enabled: 'false'
  jsonnet.enable: 'false'
  kustomize.buildOptions: '--enable-helm'
  repo.server.git.submodule.enabled: 'false'
  resource.compareoptions: |
    ignoreResourceStatusField: all
  resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
    jqPathExpressions:
      - '.webhooks[].clientConfig.caBundle'
  resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
    jqPathExpressions:
      - '.webhooks[].clientConfig.caBundle'
  resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
    jqPathExpressions:
      - '.spec.conversion.webhook.clientConfig.caBundle'
  resource.customizations.ignoreResourceUpdates.ConfigMap: |
    jqPathExpressions:
      # Ignore the cluster-autoscaler status
      - '.metadata.annotations."cluster-autoscaler.kubernetes.io/last-updated"'
      # Ignore the annotation of the legacy Leases election
      - '.metadata.annotations."control-plane.alpha.kubernetes.io/leader"'
  resource.customizations.ignoreResourceUpdates.Endpoints: |
    jsonPointers:
      - /metadata
      - /subsets
  resource.customizations.ignoreResourceUpdates.all: |
    jsonPointers:
      - /status
  resource.customizations.ignoreResourceUpdates.apps_ReplicaSet: |
    jqPathExpressions:
      - '.metadata.annotations."deployment.kubernetes.io/desired-replicas"'
      - '.metadata.annotations."deployment.kubernetes.io/max-replicas"'
      - '.metadata.annotations."rollout.argoproj.io/desired-replicas"'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Application: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
      - '.metadata.annotations."argocd.argoproj.io/refresh"'
      - '.metadata.annotations."argocd.argoproj.io/hydrate"'
      - '.operation'
  resource.customizations.ignoreResourceUpdates.argoproj.io_Rollout: |
    jqPathExpressions:
      - '.metadata.annotations."notified.notifications.argoproj.io"'
  resource.customizations.ignoreResourceUpdates.autoscaling_HorizontalPodAutoscaler: |
    jqPathExpressions:
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/behavior"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/conditions"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/metrics"'
      - '.metadata.annotations."autoscaling.alpha.kubernetes.io/current-metrics"'
  resource.customizations.ignoreResourceUpdates.discovery.k8s.io_EndpointSlice: |
    jsonPointers:
      - /metadata
      - /endpoints
      - /ports
  resource.exclusions: >
    ### Velero Backups and dynamic runtime operations do not need to be managed by ArgoCD

    - apiGroups:
        - velero.io
      kinds:
        - Backup
        - Restore
        - DownloadRequest
        - DeleteBackupRequest
        - PodVolumeBackup
        - PodVolumeRestore
    ### Added via: helm inspect values argo/argo-cd|yq '.configs.cm."resource.exclusions"'

    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events
    and UI clutter

    - apiGroups:
        - ''
        - discovery.k8s.io
      kinds:
        - Endpoints
        - EndpointSlice
    ### Internal Kubernetes resources excluded reduce the number of watched events

    - apiGroups:
        - coordination.k8s.io
      kinds:
        - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events

    - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
      kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events

    - apiGroups:
        - certificates.k8s.io
      kinds:
        - CertificateSigningRequest
    - apiGroups:
        - cert-manager.io
      kinds:
        - CertificateRequest
    ### Cert-Manager ACME issuance transients

    - apiGroups:
        - acme.cert-manager.io
      kinds:
        - Order
        - Challenge
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter

    - apiGroups:
        - cilium.io
      kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve
    performance

    - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
      kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
    ### Longhorn runtime state objects

    - apiGroups:
        - longhorn.io
      kinds:
        - Snapshot
        - Engine
        - Replica
        - Instance
  resource.respectRBAC: normal
  server.rbac.log.enforce.enable: 'true'
  statusbadge.enabled: 'false'
  timeout.hard.reconciliation: 0s
  timeout.reconciliation: 120s
  timeout.reconciliation.jitter: 60s
  url: https://hx-dev.traefik.me
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  permitOnlyProjectScopedClusters: false
  description: |-
    The default project is just here to validate your authentication.
    It is completely restricted and cannot be used to spawn any projects.
  sourceRepos:
    - ''
  destinations:
    - name: ''
      server: ''
  sourceNamespaces:
    - '*'
  clusterResourceWhitelist:
    - group: ''
      kind: ''
  clusterResourceBlacklist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hx-dev-dev
  namespace: argocd
spec:
  permitOnlyProjectScopedClusters: false
  description: hx-dev-dev project
  destinations:
    - server: '*'
      namespace: '*'
  sourceNamespaces:
    - '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    ignore:
      - kind: Secret
        name: cert-manager-webhook-ca
    warn: false
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd: enabled
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{name}}-argocd'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: .;..;/platform-configs/{{name}}/helm/argo-cd
    spec:
      project: hx-dev-dev
      sources:
        - repoURL: https://github.com/example/platform.git
          targetRevision: main
          ref: valuesRepo
        - repoURL: https://github.com/example/platform.git
          path: platform-components/helm/argo-cd
          targetRevision: main
          helm:
            ignoreMissingValueFiles: true
            releaseName: argocd
            valueFiles:
              - values.yaml
              - $valuesRepo/platform-configs/{{name}}/helm/argo-cd/values.generated.yaml
              - $valuesRepo/platform-configs/{{name}}/helm/argo-cd/additional-values.yaml
              - $valuesRepo/platform-configs/{{name}}/helm/argo-cd/values-*.yaml
      destination:
        name: '{{name}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        retry:
          limit: 5
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=false
          - PruneLast=true
          - FailOnSharedResource=true
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
---
