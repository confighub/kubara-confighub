apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "EffectiveValues"
metadata:
  name: "grafana-loki-7.1.0-default"
spec:
  files:
    -
      path: "effective-values-single-binary-filesystem.yaml"
      source: "inline-proof"
      sha256: "3de09f49023ef3add99c1cbdbe2eb617e26ce2157f5ac5520f3a3cd82d80449a"
  mergedValuesCaptured: false
  values:
    backend:
      replicas: 0
    deploymentMode: "SingleBinary"
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          -
            from: "2024-04-01"
            index:
              period: "24h"
              prefix: "loki_index_"
            object_store: "filesystem"
            schema: "v13"
            store: "tsdb"
      storage:
        type: "filesystem"
    read:
      replicas: 0
    singleBinary:
      replicas: 1
    write:
      replicas: 0
