apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ValueModel"
metadata:
  name: "grafana-loki-7.1.0"
spec:
  checkedValues:
    -
      path: "effective-values-single-binary-filesystem.yaml"
