    links:
    - icon: fas fa-globe
      name: Kubara-Homepage
      target: _blank
      url: https://kubara.io/
    - icon: fab fa-github
      name: Kubara Repo
      target: _blank
      url: https://github.com/kubara-io/kubara
    - icon: fas fa-book
