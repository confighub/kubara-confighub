        highlight-hover: '#14344A'
        highlight-primary: '#0A1E2D'
        highlight-secondary: '#10283A'
        link: '#0ABEBE'
        link-hover: '#006D75'
        text: '#E5ECF6'
        text-header: '#F7F8F8'
        text-subtitle: '#A0E6E6'
        text-title: '#F7F8F8'
