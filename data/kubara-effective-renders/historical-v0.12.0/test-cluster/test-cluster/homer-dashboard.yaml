        card-background: '#FFFFFF'
        card-shadow: '#0F172A1A'
        highlight-hover: '#475569'
        highlight-primary: '#1E293B'
        highlight-secondary: '#334155'
        link: '#2563EB'
        link-hover: '#1D4ED8'
        text: '#0F172A'
        text-header: '#F8FAFC'
        text-subtitle: '#475569'
        text-title: '#0F172A'
    connectivityCheck: true
    defaults:
