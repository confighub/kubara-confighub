# Source: homer-dashboard/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer-dashboard
spec:
  selector:
    matchLabels:
      app: homer-dashboard
      release: homer-dashboard
  template:
    metadata:
      annotations:

        dashboard-config: f83e780d48128ed41be2083efd262b15eb2e1ad3a14f9e52390185886fe30420
      labels:
        app: homer-dashboard
        release: homer-dashboard
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 1000
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: image-pull-secret
      containers:
        - name: homer-dashboard
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: b4bz/homer:v26.4.2
          imagePullPolicy: IfNotPresent
          args: [ 'run' ]
          env:
          ports:
            - name: app-internal
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: homer-assets-icons
              subPath: favicon
              mountPath: "/www/assets/icons/favicon.ico"
            - name: homer-assets-icons
              subPath: kubara_icon
              mountPath: "/www/assets/icons/kubara_icon.png"
            - name: homer-assets-tools
              subPath: alertmanager
              mountPath: "/www/assets/tools/alertmanager.png"
            - name: homer-assets-tools
              subPath: argocd
              mountPath: "/www/assets/tools/argocd.png"
            - name: homer-assets-tools
              subPath: grafana
              mountPath: "/www/assets/tools/grafana.png"
            - name: homer-assets-tools
              subPath: kyverno
              mountPath: "/www/assets/tools/kyverno.png"
            - name: homer-assets-tools
              subPath: longhorn
              mountPath: "/www/assets/tools/longhorn.png"
            - name: homer-assets-tools
              subPath: nginx
              mountPath: "/www/assets/tools/nginx.png"
            - name: homer-assets-tools
              subPath: openbao
              mountPath: "/www/assets/tools/openbao.png"
            - name: homer-assets-tools
              subPath: prometheus
              mountPath: "/www/assets/tools/prometheus.png"
            - name: homer-assets-tools
              subPath: secretsmanager
              mountPath: "/www/assets/tools/secretsmanager.png"
            - name: homer-assets-tools
              subPath: traefik
              mountPath: "/www/assets/tools/traefik.png"
            - mountPath: "/tmp"
              name: "temp-volume"
            # homer dashboard config.yaml
            - mountPath: "/www/assets/config.yml"
              name: homer-config
              subPath: "config.yml"
            # homer dashboard config.yaml
            - mountPath: "/lighttpd.conf"
              name: lighttpd-config
              subPath: lighttpd
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 100Mi
      volumes:
        - name: homer-assets-tools
          configMap:
            name: homer-assets-tools
        - name: homer-assets-icons
          configMap:
            name: homer-assets-icons
        - name: temp-volume
          emptyDir: {}
        - name: homer-config
          configMap:
            name: homer-config
        - name: lighttpd-config
          configMap:
            name: lighttpd-config
---
