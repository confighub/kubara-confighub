apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "HelmPainReport"
metadata:
  name: "metrics-server-metrics-server-3.13.1"
spec:
  chart:
    name: "metrics-server/metrics-server"
    version: "3.13.1"
    source: "https://kubernetes-sigs.github.io/metrics-server/"
    digest: "084e6edb680cf4e2acc30bd496568c53fdf663cbacf6e17876b25785c35b7a13"
