      configHubHome: "dependency-lock"
      disposition: "absorbed-into-recipe"
      linkedReceipt: "dependency-lock.yaml"
      supportedVariantStatus: "handled"
    -
      id: "generated-facts"
      detectedPainPoint: "tls.type=helm would use genSelfSignedCert and lookup; it is intentionally not promoted until generated-fact receipts are formalized. external-tls-ca avoids Helm generation but still requires a matching CA bundle before render."
      evidence:
        - "variants/default/variant.yaml and variants/external-tls-ca/variant.yaml"
      configHubHome: "generated-fact"
      disposition: "handled-by-variant"
      linkedReceipt: "value-model.yaml"
      supportedVariantStatus: "avoided-by-current-variants"
    -
      id: "target-facts"
