    - "npm run kubara-platform-matrix:verify"
    - "npm run kubara-catalog-release:generate"
    - "npm run kubara-catalog-release:verify"
    - "npm run kubara-release:verify"
  gates:
    -
      id: "catalog-alignment"
      outcome: "Immutable upstream snapshots, byte-preserving aligned exports, all 18 exact Kubara catalogs 1.1.0 selections, and an additive 103-component/130-version Catalog."
      packageScripts:
        - "kubara-catalog-adapter:verify"
        - "kubara-catalog-candidates:verify"
        - "kubara-current-catalog-candidates:verify"
        - "kubara-catalog-promotion:verify"
        - "kubara-current-catalog-promotion:verify"
        - "kubara-catalog-oci:self-test"
        - "kubara-catalog-oci:verify"
        - "kubara-catalog-full-coverage:self-test"
        - "kubara-catalog-full-coverage:verify-candidates"
        - "kubara-catalog-full-coverage:verify"
    -
      id: "current-example"
      outcome: "Kubara v0.13.0 generates the same 135 files from upstream and ConfigHub-aligned catalogs and yields 13 exact effective renders, including explicit healthy kind Traefik exposure."
      packageScripts:
        - "kubara-current-example:verify"
        - "kubara-effective-renders:verify"
    -
      id: "git-handoff-preparation"
      outcome: "One deterministic preparer converts an ordinary Kubara-generated worktree plus a reviewed exact artifact lock into a separate clean, importer-compatible Git subtree; the current 13-render fixture is committed and offline-verifiable."
      packageScripts:
        - "kubara-git-handoff:verify-current"
        - "kubara-git-handoff:self-test"
    -
      id: "git-revision-import"
      outcome: "One deterministic command path compiles an immutable Kubara Git revision, publishes component-first OCI packages, reconciles the exact user-selected ConfigHub organization and cluster-local Argo delivery Applications, and requires a second zero-action apply receipt without using AI."
      packageScripts:
        - "kubara-git-import:self-test"
        - "kubara-selected-org:self-test"
        - "kubara-app-release:self-test"
        - "kubara-app-release-runner:self-test"
        - "kubara-adoption:self-test"
    -
      id: "live-qualification"
      outcome: "Historical and current exact chart selections each retain a serial 13-lane live qualification receipt."
      packageScripts:
        - "kubara-live-qualification:verify"
        - "kubara-current-live-qualification:verify"
    -
      id: "matrix-and-wiring"
      outcome: "Current and retained historical component-by-cluster and dependency views are reproducible generated data."
      packageScripts:
        - "kubara-wiring:verify"
        - "kubara-platform-matrix:verify"
    -
      id: "mini-idp"
      outcome: "One idempotent reconciler owns the four-cluster platform, hx-web, cubbychat, governance controls, matrix, and visible wiring evidence; ConfigHub selects the exact release, every managed Argo Application has automated sync disabled, and Argo reconciles only a revalidated ManifestDigest operation submitted with Kubernetes identity compare-and-set; its receipt requires an initial reconciliation followed by a zero-action rerun, plus exact ConfigHub inventory and zero residue in the declared Argo/workload audit scope."
      packageScripts:
        - "kubara-mini-idp:receipt-verify"
        - "kubara-mini-idp:orphan-audit:receipt-verify"
    -
      id: "mini-idp-performance"
      outcome: "The accepted live receipt ends with an adjacent changed apply and immediate zero-action apply under one execution fingerprint; both retain schema-v2 measurements within the four-cluster fixture budgets and the pair is backed by the scoped residue audit."
      packageScripts:
        - "kubara-mini-idp:performance-contract:verify"
        - "kubara-mini-idp:performance:self-test"
        - "kubara-mini-idp:performance:receipt-verify"
    -
      id: "faithful-hub-spoke"
      outcome: "The unchanged Kubara hub Argo CD to registered spoke topology is retained as the faithful lane."
      packageScripts:
        - "kubara-faithful-hub-spoke:verify"
    -
      id: "public-release"
      outcome: "The linear website path uses current v0.13 evidence while retaining v0.12 as historical compatibility evidence."
      packageScripts:
        - "catalog:status:verify"
        - "catalog:maps:verify"
        - "catalog:index:verify"
        - "catalog:review:verify"
        - "installer-oci:catalog:verify"
        - "npm-scripts:catalog:verify"
        - "kubara-catalog-release:verify"
        - "site:verify"
        - "kubara-release:verify"
  offlineVerification:
    - "node scripts/generate-kubara-catalog-adapter.mjs --verify"
    - "node scripts/run-kubara-catalog-candidates.mjs --verify"
    - "node scripts/run-kubara-current-catalog-candidates.mjs --verify"
    - "node scripts/publish-installer-oci-packages.mjs --self-test"
