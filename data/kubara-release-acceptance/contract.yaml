    - "node scripts/run-kubara-live-qualification.mjs --verify --current"
    - "node scripts/promote-kubara-catalog-candidates.mjs --verify"
    - "node scripts/promote-kubara-catalog-candidates.mjs --verify --current"
    - "node scripts/complete-kubara-catalog-1-1-coverage.mjs --verify"
    - "node scripts/run-kubara-faithful-hub-spoke-proof.mjs --verify"
    - "node scripts/reconcile-kubara-mini-idp.mjs --receipt-verify"
    - "node scripts/audit-kubara-mini-idp-orphans.mjs --receipt-verify"
    - "node scripts/verify-kubara-mini-idp-performance.mjs --receipt-verify"
    - "node scripts/generate-kubara-catalog-release.mjs --verify"
