name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Adoption self-tests
        run: npm run kubara-adoption:self-test
      - name: Reconcile receipt
        run: npm run kubara-mini-idp:receipt-verify
      - name: Performance receipt
        run: npm run kubara-mini-idp:performance:receipt-verify
      - name: Orphan audit receipt
        run: npm run kubara-mini-idp:orphan-audit:receipt-verify
      - name: Platform matrix
        run: npm run kubara-platform-matrix:verify
      - name: Wiring graph
        run: npm run kubara-wiring:verify
      - name: Faithful hub-spoke proof
        run: npm run kubara-faithful-hub-spoke:verify
      - name: Certified bundle receipts
        run: npm run certified-bundles:verify

  # The cub kubara plugin: its tests hold the committed plan and services
  # examples under examples/cub-kubara, so a behaviour change shows up as a diff.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi
